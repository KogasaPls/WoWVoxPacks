name: Publish to CurseForge
# create-release.yml calls this workflow and hands it the tag it just cut. Keep that the only
# automatic path: a release event reaches a workflow or not depending on which identity created
# the release, and a second trigger alongside the call publishes the same tag twice.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag to publish. Empty resolves the latest release.'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish e.g. "v12.1.0-r3". Empty resolves the latest release.'
        default: ''
        required: false
      voices:
        description: 'Comma separated list of voices to publish e.g. "Wavenet_E,Neural2_C,Studio_Q"'
        default: '"Wavenet_E","Neural2_C","Studio_Q"'
        required: true
      addons:
        description: 'Comma separated list of addons to publish e.g. "BigWigs_Voice","BigWigs_Countdown","NorthernSkyRaidTools"'
        default: '"BigWigs_Voice","BigWigs_Countdown","Callouts","ExBoss","NorthernSkyRaidTools"'
        required: true

# Serialize automatic and manual runs so they don't race on the same CurseForge project.
concurrency:
  group: publish-to-curseforge
  cancel-in-progress: false

jobs:
  publish-addon:
    strategy:
      # Each voice×addon publish is independent; don't cancel the rest when one
      # fails so a single bad upload can't block every other package.
      max-parallel: 3
      fail-fast: false
      matrix:
        voice: ${{ fromJSON(format('[{0}]', inputs.voices || '"Wavenet_E","Neural2_C","Studio_Q"')) }}
        addon: ${{ fromJSON(format('[{0}]', inputs.addons || '"BigWigs_Voice","BigWigs_Countdown","Callouts","ExBoss","NorthernSkyRaidTools"')) }}
        voice-to-addon-to-project-id-json:
          - '{
            "Wavenet_E": {
              "BigWigs_Voice": 1215288,
              "BigWigs_Countdown": 1217577,
              "Callouts": 1520297,
              "ExBoss": 1551653,
              "NorthernSkyRaidTools": 1648855
            },
            "Neural2_C": {
              "BigWigs_Voice": 1217580,
              "BigWigs_Countdown": 1217583,
              "Callouts": 1520293,
              "ExBoss": 1551645,
              "NorthernSkyRaidTools": 1648938
            },
            "Studio_Q": {
              "BigWigs_Voice": 1218355,
              "BigWigs_Countdown": 1218357,
              "Callouts": 1520296,
              "ExBoss": 1551655,
              "NorthernSkyRaidTools": 1648940
            }
          }'
        # Mirrors what the generated TOC declares in-game: ## Dependencies becomes a
        # requiredDependency, ## OptionalDeps an optionalDependency. Keys are CurseForge
        # URL slugs, not addon folder names. An addon absent here uploads with no
        # relations, so a workflow_dispatch naming a new addon still publishes.
        # The slug is the one the project page resolves to today, not the one older file and
        # download URLs still carry: CurseForge answers 1018 "does not exist, is not accessible,
        # or belongs to an unrelated root category" for big-wigs, and rejects the whole upload.
        addon-to-relations-json:
          - '{
            "BigWigs_Voice": "bigwigs:requiredDependency",
            "BigWigs_Countdown": "bigwigs:requiredDependency",
            "Callouts": "libsharedmedia-3-0:optionalDependency",
            "ExBoss": "exboss:requiredDependency,libsharedmedia-3-0:optionalDependency",
            "NorthernSkyRaidTools": "northern-sky-raid-tools:optionalDependency,libsharedmedia-3-0:optionalDependency"
          }'

    runs-on: ubuntu-latest
    # Downloading the release assets is all this needs; the CurseForge upload authenticates
    # with its own token.
    permissions:
      contents: read
    name: Publish ${{ matrix.addon }} (${{ matrix.voice }}) (Project ID ${{ fromJSON(matrix.voice-to-addon-to-project-id-json)[matrix.voice][matrix.addon] }})
    steps:
      - name: Set release tag
        id: set-release-tag
        # The caller knows the tag it just cut, so it says so. Resolving the latest release is
        # only for a manual run, where "the one I just published" is what a human means.
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="$RELEASE_TAG_INPUT"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          fi
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "null" ]; then
            echo "Could not determine the release tag to publish" >&2
            exit 1
          fi
          echo "Publishing ${RELEASE_TAG}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
      - name: Check out the release
        # Before the assets are downloaded: checkout cleans the workspace. The tag's own
        # settings are what that build declared, which a manual run of an older tag needs.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set release game_versions
        id: set-release-game-versions
        # Not from the tag: the addons support every patch they list an Interface for, and
        # BigWigs_Voice numbers its own re-releases within a patch (v12.1.0.1), which is a
        # version no game ever shipped. Tags cut before this workflow learned that have no
        # script to run, and their names were already game versions.
        run: |
          if [ -f scripts/game_versions.py ]; then
            RELEASE_GAME_VERSIONS=$(python scripts/game_versions.py --settings appsettings.json)
          else
            RELEASE_GAME_VERSIONS="${RELEASE_TAG#v}"
            RELEASE_GAME_VERSIONS="${RELEASE_GAME_VERSIONS%%-*}"
          fi
          echo "Publishing for game versions: ${RELEASE_GAME_VERSIONS}"
          echo "RELEASE_GAME_VERSIONS=${RELEASE_GAME_VERSIONS}" >> "$GITHUB_ENV"
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          fileName: WoWVoxPacks_${{ matrix.voice }}_${{ matrix.addon }}_${{ env.RELEASE_TAG }}.zip
          extract: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        env:
          CF_PROJECT_ID: ${{ fromJSON(matrix.voice-to-addon-to-project-id-json)[matrix.voice][matrix.addon] }}
        with:
          file_path: WoWVoxPacks_${{ matrix.voice }}_${{ matrix.addon }}_${{ env.RELEASE_TAG }}.zip
          game_endpoint: 'wow'
          project_id: ${{ env.CF_PROJECT_ID }}
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          display_name: ${{ matrix.addon }} (${{ matrix.voice }}) ${{ env.RELEASE_TAG }}
          game_versions: ${{ env.RELEASE_GAME_VERSIONS }}
          relations: ${{ fromJSON(matrix.addon-to-relations-json)[matrix.addon] }}
