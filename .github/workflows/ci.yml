name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get-actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Check workflow files
        run: '"${{ steps.get-actionlint.outputs.executable }}" -color'
        shell: bash

  dotnet:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Python tests
        run: python -m unittest discover -s tests/scripts -p 'test_*.py' -v
      - name: Build
        run: dotnet build -v q --nologo -warnaserror
      - name: Unit tests
        run: dotnet test tests/WoWVoxPack.UnitTests -v q --nologo

  lua:
    name: Generated Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install LuaJIT and luacheck
        run: |
          sudo apt-get update
          # CallbackHandler-1.0 needs loadstring, so the interpreter has to be 5.1-compatible.
          sudo apt-get install -y luajit luarocks
          sudo luarocks install luacheck
          luajit -v
          luacheck --version
      # Regenerates the addon Lua from the C# and runs it. A failure here is a failure users
      # would have seen at login, so it must fail the build.
      - name: Run the Lua harness
        run: tests/lua/run.sh
