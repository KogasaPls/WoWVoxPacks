name: Check for updates
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the BigWigs_Voice release tag has not moved
        type: boolean
        default: false
  schedule:
    - cron: "0 14 * * 2-4"

concurrency:
  group: check-for-updates
  cancel-in-progress: true

jobs:
  check-bigwigs-voice-version:
    runs-on: ubuntu-latest
    outputs:
      bigwigs_version: ${{ steps.compare-versions.outputs.bigwigs_version }}
      needs_update: ${{ steps.compare-versions.outputs.needs_update }}
      version_changed: ${{ steps.compare-versions.outputs.version_changed }}
    steps:
      - name: Get latest BigWigsVoice release
        # The releases/latest endpoint returns the newest release that is neither a draft
        # nor a prerelease, matching the excludes the retired action was configured with.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/BigWigsMods/BigWigs_Voice/releases/latest --jq .tag_name > version.txt
      - name: Get previous version
        run: |
          curl -sf -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/contents/bigwigs-voice-version.txt" \
            -o previous-version.txt || true
      - name: Compare versions
        id: compare-versions
        # The version file is the only thing standing between upstream and a rebuild, so
        # anything that writes it without building blinds this check: a release-prep commit
        # that set it to v12.1.0 a day before BigWigs published v12.1.0 hid that release's
        # entire spell sync (151 new spells, plus Infernocore -> Inferno Spit) until the
        # next upstream tag. Dispatch with force to rebuild against the current lists.
        env:
          FORCE: ${{ inputs.force }}
        run: |
          new_version=$(cat version.txt)
          echo "bigwigs_version=${new_version}" >> "$GITHUB_OUTPUT"

          if [ ! -s previous-version.txt ]; then
            echo "No previous version detected"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${new_version}" != "$(cat previous-version.txt)" ]; then
            echo "New version detected (old: $(cat previous-version.txt), new: ${new_version})"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          elif [ "${FORCE}" = "true" ]; then
            echo "No new version detected, rebuilding anyway (force)"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new version detected"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
  check-nsrt-vocabulary:
    runs-on: ubuntu-latest
    # A network hiccup here must never block the BigWigs half of the update. The job
    # reports no change and the run continues.
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    outputs:
      needs_update: ${{ steps.compare-vocabulary.outputs.needs_update }}
      added: ${{ steps.compare-vocabulary.outputs.added }}
      removed: ${{ steps.compare-vocabulary.outputs.removed }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the NSRT default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The default branch, not releases/latest. NSRT tags rarely relative to how often
          # it adds callouts: release 12.0.114 sat 21 callouts behind main, so tracking
          # releases meant the vocabulary was reliably stale. The branch is also the layout
          # the extract step already had to cope with (nested under NorthernSkyRaidTools/,
          # where a release tarball is flat).
          branch=$(gh api repos/Reloe/NorthernSkyRaidTools --jq .default_branch)
          echo "NSRT default branch: ${branch}"
          mkdir -p nsrt-src
          curl -sfL "https://github.com/Reloe/NorthernSkyRaidTools/archive/refs/heads/${branch}.tar.gz" \
            | tar -xz -C nsrt-src --strip-components=1
      - name: Extract the callout vocabulary
        id: extract
        run: |
          # NSRT's sound-file fallback is path..sound..".ogg", so a file name is a callout
          # name. Released and main layouts differ, so search rather than assume a path.
          sounds_dir=$(find nsrt-src -type d -path '*/Media/Sounds' | head -1)
          if [ -z "$sounds_dir" ]; then
            echo "Could not find Media/Sounds in the NSRT source" >&2
            exit 1
          fi
          {
            echo "# Northern Sky Raid Tools callout vocabulary."
            echo "# Regenerated by .github/workflows/update.yml from Media/Sounds/*.ogg. Do not edit by hand."
            find "$sounds_dir" -maxdepth 1 -name '*.ogg' -printf '%f\n' \
              | sed 's/\.ogg$//' | LC_ALL=C sort -f
          } > nsrt-vocabulary.new
          new_count=$(grep -vc '^#' nsrt-vocabulary.new || true)
          old_count=$(grep -vc '^#' nsrt-vocabulary.txt || true)
          echo "Extracted ${new_count} callouts (tracked: ${old_count})"
          if [ "${new_count}" -eq 0 ]; then
            echo "No .ogg files found under ${sounds_dir}; refusing to publish an empty vocabulary" >&2
            exit 1
          fi
          if [ "${old_count}" -gt 0 ] && [ "${new_count}" -lt $(( old_count / 2 )) ]; then
            echo "Vocabulary shrank from ${old_count} to ${new_count}; refusing as a likely upstream layout change" >&2
            exit 1
          fi
      - name: Extract the alert-only vocabulary
        # The alerts speak their own text field, so a string with no Media/Sounds file never
        # enters the vocabulary above. This regenerates the rest of what the alerts can speak
        # from the same checkout; when upstream later records a string, it moves files on its
        # own. The checker exits nonzero on any source shape it cannot read, and seasonal
        # churn legitimately halves a list this small, so it carries no shrink guard.
        run: |
          python3 scripts/check_nsrt_tts_coverage.py \
            --source nsrt-src \
            --vocabulary nsrt-vocabulary.new \
            --output alert-strings.txt \
            --exit-zero > coverage.txt
          {
            echo "### NSRT TTS coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "# Northern Sky Raid Tools alert strings that its Media/Sounds has no file for."
            echo "# Regenerated by .github/workflows/update.yml from the alert sources. Do not edit by hand;"
            echo "# runtime-composed strings are enumerated in nsrt-extra-vocabulary.txt instead."
            LC_ALL=C sort -f alert-strings.txt
          } > nsrt-alert-vocabulary.new
      - name: Verify the vocabularies cover every alert
        # The uncovered check guards this pipeline (everything uncovered went into the alert
        # file, so a miss here means the generation above is broken). The composed check
        # guards upstream: hand-enumerated strings cannot regenerate, so a new or changed
        # composed site must fail this job until someone enumerates it.
        run: |
          python3 scripts/check_nsrt_tts_coverage.py \
            --source nsrt-src \
            --vocabulary nsrt-vocabulary.new \
            --vocabulary nsrt-alert-vocabulary.new \
            --vocabulary nsrt-extra-vocabulary.txt \
            --composed nsrt-composed-sites.txt
      - name: Compare against the tracked vocabulary
        id: compare-vocabulary
        # comm collates with the ambient locale, so it has to agree with the C ordering the
        # files were sorted in. Under en_US it does not: "Rune" and "RunOut" sort in
        # opposite orders, and the branch vocabulary contains both, which had comm reporting
        # Rune as simultaneously added and removed.
        env:
          LC_ALL: C
        run: |
          # Compared per file, not as a union: a string upstream records moves from the
          # alert file to the sounds file, which a union comparison reads as no change.
          needs_update=false
          for name in nsrt-vocabulary nsrt-alert-vocabulary; do
            cmp -s <(grep -v '^#' "${name}.txt" | sort) <(grep -v '^#' "${name}.new" | sort) \
              || needs_update=true
          done
          if [ "${needs_update}" = "false" ]; then
            echo "Vocabulary unchanged"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            cat nsrt-vocabulary.txt nsrt-alert-vocabulary.txt | grep -v '^#' | sort > old.txt
            cat nsrt-vocabulary.new nsrt-alert-vocabulary.new | grep -v '^#' | sort > new.txt
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            {
              echo "added<<VOCAB_EOF"
              comm -13 old.txt new.txt
              echo "VOCAB_EOF"
              echo "removed<<VOCAB_EOF"
              comm -23 old.txt new.txt
              echo "VOCAB_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the new vocabulary
        if: steps.compare-vocabulary.outputs.needs_update == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nsrt-vocabulary
          path: |
            nsrt-vocabulary.new
            nsrt-alert-vocabulary.new
      - name: File an issue when this check fails
        # continue-on-error keeps the run green when this job breaks, so an issue is the
        # failure's only visible trace. GH_REPO is set because a checkout failure lands here
        # too, leaving gh without a local repository to infer it from.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="The NSRT vocabulary check is failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $run_url"
          else
            gh issue create --title "$title" --body "$run_url"
          fi
  create-pull-request:
    needs: [ check-bigwigs-voice-version, check-nsrt-vocabulary ]
    # The NSRT job carries continue-on-error, so its upstream may be temporarily unavailable
    # without blocking a BigWigs update. A failed BigWigs check must still block this job:
    # its version output would otherwise be committed as an empty file. The lorrgs
    # vocabulary is imported by hand (see scripts/extract_lorrgs_vocabulary.py); this
    # workflow only rebuilds from whatever is tracked.
    if: ${{ needs.check-bigwigs-voice-version.outputs.needs_update == 'true' || needs.check-nsrt-vocabulary.outputs.needs_update == 'true' }}
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      CI: true
      DOTNET_ENVIRONMENT: Release
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GH_TOKEN: ${{ secrets.WORKFLOW_RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Read new version
        id: read-version
        run: |
          echo "$BIGWIGS_VERSION" > bigwigs-voice-version.txt
        env:
          BIGWIGS_VERSION: ${{ needs.check-bigwigs-voice-version.outputs.bigwigs_version }}
      - name: Download the new vocabulary
        if: ${{ needs.check-nsrt-vocabulary.outputs.needs_update == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: nsrt-vocabulary
      - name: Apply the new vocabulary
        if: ${{ needs.check-nsrt-vocabulary.outputs.needs_update == 'true' }}
        run: |
          mv nsrt-vocabulary.new nsrt-vocabulary.txt
          mv nsrt-alert-vocabulary.new nsrt-alert-vocabulary.txt
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build new version
        run: dotnet build
      - name: Run addon builder
        run: dotnet run --project src/WoWVoxPack.Builder/WoWVoxPack.Builder.csproj
      - name: Create a pull request
        uses: peter-evans/create-pull-request@v8
        id: create-pull-request
        with:
          token: ${{ secrets.WORKFLOW_RELEASE_PAT }}
          commit-message: "[ci] Automatic update"
          title: Automatic update
          body: |
            Automatically created by the update workflow.

            - BigWigs_Voice version: ${{ needs.check-bigwigs-voice-version.outputs.bigwigs_version }}

            New callouts:
            ```
            ${{ needs.check-nsrt-vocabulary.outputs.added }}
            ```

            Removed callouts:
            ```
            ${{ needs.check-nsrt-vocabulary.outputs.removed }}
            ```
          branch: ci/update-${{ needs.check-bigwigs-voice-version.outputs.bigwigs_version }}-${{ github.run_id }}
          delete-branch: true
          base: main
          add-paths: |
            output/
            bigwigs-voice-version.txt
            nsrt-vocabulary.txt
            nsrt-alert-vocabulary.txt
          sign-commits: true
      - name: Enable Pull Request Automerge
        run: |
          if [[ "$PR_OPERATION" != "none" && -n "$PR_NUMBER" ]]; then
            gh pr merge --merge --auto "$PR_NUMBER"
          else
            echo "No pull request changes to merge (operation: ${PR_OPERATION:-none})"
          fi
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_RELEASE_PAT }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
