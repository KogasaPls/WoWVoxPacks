# actionlint 1.7.12 predates concurrency.queue, which GitHub supports.
# Remove these exact diagnostic exceptions when actionlint supports it:
# https://github.com/rhysd/actionlint/issues/657
paths:
  .github/workflows/create-release.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/publish-to-curseforge.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
