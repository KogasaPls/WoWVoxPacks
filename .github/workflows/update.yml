name: Check for updates
on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 2-4"

concurrency:
  group: check-for-updates
  cancel-in-progress: true

jobs:
  check-bigwigs-voice-version:
    runs-on: ubuntu-latest
    outputs:
      bigwigs_version: ${{ steps.compare-versions.outputs.bigwigs_version }}
      needs_update: ${{ steps.compare-versions.outputs.needs_update }}
    steps:
      - name: Get latest BigWigsVoice release
        id: get-bigwigsvoice-release
        uses: pozetroninc/github-action-get-latest-release@v0.8.0
        with:
          owner: BigWigsMods
          repo: BigWigs_Voice
          excludes: prerelease, draft
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write version to file
        run: echo "${{ steps.get-bigwigsvoice-release.outputs.release }}" > version.txt
      - name: Get previous version
        run: |
          curl -sf -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/contents/bigwigs-voice-version.txt" \
            -o previous-version.txt || true
      - name: Compare versions
        id: compare-versions
        run: |
          new_version=$(cat version.txt)
          echo "bigwigs_version=${new_version}" >> "$GITHUB_OUTPUT"

          if [ ! -s previous-version.txt ]; then
            echo "No previous version detected"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${new_version}" != "$(cat previous-version.txt)" ]; then
            echo "New version detected (old: $(cat previous-version.txt), new: ${new_version})"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new version detected"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
  check-nsrt-vocabulary:
    runs-on: ubuntu-latest
    # A network hiccup here must never block the BigWigs half of the update. The job
    # reports no change and the run continues.
    continue-on-error: true
    outputs:
      needs_update: ${{ steps.compare-vocabulary.outputs.needs_update }}
      added: ${{ steps.compare-vocabulary.outputs.added }}
      removed: ${{ steps.compare-vocabulary.outputs.removed }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the NSRT default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The default branch, not releases/latest. NSRT tags rarely relative to how often
          # it adds callouts: release 12.0.114 sat 21 callouts behind main, so tracking
          # releases meant the vocabulary was reliably stale. The branch is also the layout
          # the extract step already had to cope with (nested under NorthernSkyRaidTools/,
          # where a release tarball is flat).
          branch=$(gh api repos/Reloe/NorthernSkyRaidTools --jq .default_branch)
          echo "NSRT default branch: ${branch}"
          mkdir -p nsrt-src
          curl -sfL "https://github.com/Reloe/NorthernSkyRaidTools/archive/refs/heads/${branch}.tar.gz" \
            | tar -xz -C nsrt-src --strip-components=1
      - name: Extract the callout vocabulary
        id: extract
        run: |
          # NSRT's sound-file fallback is path..sound..".ogg", so a file name is a callout
          # name. Released and main layouts differ, so search rather than assume a path.
          sounds_dir=$(find nsrt-src -type d -path '*/Media/Sounds' | head -1)
          if [ -z "$sounds_dir" ]; then
            echo "Could not find Media/Sounds in the NSRT source" >&2
            exit 1
          fi
          {
            echo "# Northern Sky Raid Tools callout vocabulary."
            echo "# Regenerated by .github/workflows/update.yml from Media/Sounds/*.ogg. Do not edit by hand."
            find "$sounds_dir" -maxdepth 1 -name '*.ogg' -printf '%f\n' \
              | sed 's/\.ogg$//' | LC_ALL=C sort -f
          } > nsrt-vocabulary.new
          new_count=$(grep -vc '^#' nsrt-vocabulary.new || true)
          old_count=$(grep -vc '^#' nsrt-vocabulary.txt || true)
          echo "Extracted ${new_count} callouts (tracked: ${old_count})"
          if [ "${new_count}" -eq 0 ]; then
            echo "No .ogg files found under ${sounds_dir}; refusing to publish an empty vocabulary" >&2
            exit 1
          fi
          if [ "${old_count}" -gt 0 ] && [ "${new_count}" -lt $(( old_count / 2 )) ]; then
            echo "Vocabulary shrank from ${old_count} to ${new_count}; refusing as a likely upstream layout change" >&2
            exit 1
          fi
      - name: Compare against the tracked vocabulary
        id: compare-vocabulary
        # comm collates with the ambient locale, so it has to agree with the C ordering the
        # files were sorted in. Under en_US it does not: "Rune" and "RunOut" sort in
        # opposite orders, and the branch vocabulary contains both, which had comm reporting
        # Rune as simultaneously added and removed.
        env:
          LC_ALL: C
        run: |
          grep -v '^#' nsrt-vocabulary.txt | sort > old.txt || true
          grep -v '^#' nsrt-vocabulary.new | sort > new.txt
          if cmp -s old.txt new.txt; then
            echo "Vocabulary unchanged"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            {
              echo "added<<VOCAB_EOF"
              comm -13 old.txt new.txt
              echo "VOCAB_EOF"
              echo "removed<<VOCAB_EOF"
              comm -23 old.txt new.txt
              echo "VOCAB_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the new vocabulary
        if: steps.compare-vocabulary.outputs.needs_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nsrt-vocabulary
          path: nsrt-vocabulary.new
  check-lorrgs-vocabulary:
    runs-on: ubuntu-latest
    # Lorrgs is an independent upstream. If it is temporarily unavailable, keep allowing
    # BigWigs and NSRT updates to proceed without replacing the tracked vocabulary.
    continue-on-error: true
    outputs:
      needs_update: ${{ steps.compare-vocabulary.outputs.needs_update }}
      added: ${{ steps.compare-vocabulary.outputs.added }}
      removed: ${{ steps.compare-vocabulary.outputs.removed }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Download the lorrgs default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(gh api repos/gitarrg/lorrgs --jq .default_branch)
          commit=$(gh api "repos/gitarrg/lorrgs/commits/${branch}" --jq .sha)
          echo "Lorrgs default branch: ${branch} (${commit})"
          echo "LORRGS_COMMIT=${commit}" >> "$GITHUB_ENV"
          mkdir -p lorrgs-src
          curl -sfL "https://github.com/gitarrg/lorrgs/archive/${commit}.tar.gz" \
            | tar -xz -C lorrgs-src --strip-components=1
      - name: Extract the player-reminder vocabulary
        run: |
          cd lorrgs-src
          uv run --frozen python "$GITHUB_WORKSPACE/scripts/extract_lorrgs_vocabulary.py" \
            --source . \
            --source-commit "$LORRGS_COMMIT" \
            --output "$GITHUB_WORKSPACE/lorrgs-vocabulary.new"

          new_count=$(grep -vc '^#' "$GITHUB_WORKSPACE/lorrgs-vocabulary.new" || true)
          old_count=$(grep -vc '^#' "$GITHUB_WORKSPACE/lorrgs-vocabulary.txt" || true)
          echo "Extracted ${new_count} callouts (tracked: ${old_count})"
          if [ "${new_count}" -eq 0 ]; then
            echo "Lorrgs produced an empty vocabulary; refusing to publish it" >&2
            exit 1
          fi
          if [ "${old_count}" -gt 0 ] && [ "${new_count}" -lt $(( old_count / 2 )) ]; then
            echo "Vocabulary shrank from ${old_count} to ${new_count}; refusing as a likely upstream layout change" >&2
            exit 1
          fi
      - name: Compare against the tracked vocabulary
        id: compare-vocabulary
        env:
          LC_ALL: C
        run: |
          grep -v '^#' lorrgs-vocabulary.txt | sort > old.txt || true
          grep -v '^#' lorrgs-vocabulary.new | sort > new.txt
          if cmp -s old.txt new.txt; then
            echo "Vocabulary unchanged"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            removed_count=$(comm -23 old.txt new.txt | grep -c '[^[:space:]]' || true)
            if [ "${removed_count}" -gt 5 ]; then
              echo "Lorrgs removed ${removed_count} callouts at once; refusing as a likely upstream rename" >&2
              exit 1
            fi
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            {
              echo "added<<VOCAB_EOF"
              comm -13 old.txt new.txt
              echo "VOCAB_EOF"
              echo "removed<<VOCAB_EOF"
              comm -23 old.txt new.txt
              echo "VOCAB_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the new vocabulary
        if: steps.compare-vocabulary.outputs.needs_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lorrgs-vocabulary
          path: lorrgs-vocabulary.new
  create-pull-request:
    needs: [ check-bigwigs-voice-version, check-nsrt-vocabulary, check-lorrgs-vocabulary ]
    # The vocabulary jobs carry continue-on-error, so either upstream may be temporarily
    # unavailable without blocking an update from the others. A failed BigWigs check must
    # still block this job: its version output would otherwise be committed as an empty file.
    if: ${{ needs.check-bigwigs-voice-version.outputs.needs_update == 'true' || needs.check-nsrt-vocabulary.outputs.needs_update == 'true' || needs.check-lorrgs-vocabulary.outputs.needs_update == 'true' }}
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      CI: true
      DOTNET_ENVIRONMENT: Release
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GH_TOKEN: ${{ secrets.WORKFLOW_RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Read new version
        id: read-version
        run: |
          echo "$BIGWIGS_VERSION" > bigwigs-voice-version.txt
        env:
          BIGWIGS_VERSION: ${{ needs.check-bigwigs-voice-version.outputs.bigwigs_version }}
      - name: Download the new vocabulary
        if: ${{ needs.check-nsrt-vocabulary.outputs.needs_update == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: nsrt-vocabulary
      - name: Download the new lorrgs vocabulary
        if: ${{ needs.check-lorrgs-vocabulary.outputs.needs_update == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: lorrgs-vocabulary
      - name: Retire removed callouts
        # RetiredCallouts.json is owned by the Callouts player-reminder vocabulary only.
        # NSRT has a separate addon and must not populate this shared Callouts store.
        if: ${{ needs.check-lorrgs-vocabulary.outputs.needs_update == 'true' }}
        run: |
          python scripts/retire_removed_callouts.py \
            --retired src/WoWVoxPack.AddOns.Callouts/RetiredCallouts.json \
            --vocabulary lorrgs-vocabulary.txt lorrgs-vocabulary.new
      - name: Apply the new vocabulary
        if: ${{ needs.check-nsrt-vocabulary.outputs.needs_update == 'true' }}
        run: mv nsrt-vocabulary.new nsrt-vocabulary.txt
      - name: Apply the new lorrgs vocabulary
        if: ${{ needs.check-lorrgs-vocabulary.outputs.needs_update == 'true' }}
        run: mv lorrgs-vocabulary.new lorrgs-vocabulary.txt
      - name: Bump the release revision for a vocabulary-only update
        if: ${{ needs.check-bigwigs-voice-version.outputs.needs_update != 'true' }}
        run: echo $(( $(cat release-revision.txt) + 1 )) > release-revision.txt
      - name: Reset the release revision when BigWigs moved
        if: ${{ needs.check-bigwigs-voice-version.outputs.needs_update == 'true' }}
        run: echo 0 > release-revision.txt
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build new version
        run: |
          VERSION=${TAG#"v"} dotnet build
      - name: Run addon builder
        run: |
          VERSION=${TAG#"v"} dotnet run --project src/WoWVoxPack.Builder/WoWVoxPack.Builder.csproj
        env:
          TAG: ${{ needs.check-bigwigs-voice-version.outputs.bigwigs_version }}
      - name: Create a pull request
        uses: peter-evans/create-pull-request@v8
        id: create-pull-request
        with:
          token: ${{ secrets.WORKFLOW_RELEASE_PAT }}
          commit-message: "[ci] Automatic update"
          title: Automatic update
          body: |
            Automatically created by the update workflow.

            - BigWigs_Voice version: ${{ needs.check-bigwigs-voice-version.outputs.bigwigs_version }}

            New callouts:
            ```
            ${{ needs.check-nsrt-vocabulary.outputs.added }}
            ```

            Removed callouts:
            ```
            ${{ needs.check-nsrt-vocabulary.outputs.removed }}
            ```

            New lorrgs player callouts:
            ```
            ${{ needs.check-lorrgs-vocabulary.outputs.added }}
            ```

            Removed lorrgs player callouts:
            ```
            ${{ needs.check-lorrgs-vocabulary.outputs.removed }}
            ```
          branch: ci/update-${{ needs.check-bigwigs-voice-version.outputs.bigwigs_version }}-${{ github.run_id }}
          delete-branch: true
          base: main
          add-paths: |
            output/
            bigwigs-voice-version.txt
            nsrt-vocabulary.txt
            lorrgs-vocabulary.txt
            release-revision.txt
            src/WoWVoxPack.AddOns.Callouts/RetiredCallouts.json
          sign-commits: true
      - name: Enable Pull Request Automerge
        run: |
          if [[ "$PR_OPERATION" != "none" && -n "$PR_NUMBER" ]]; then
            gh pr merge --merge --auto "$PR_NUMBER"
          else
            echo "No pull request changes to merge (operation: ${PR_OPERATION:-none})"
          fi
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_RELEASE_PAT }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
