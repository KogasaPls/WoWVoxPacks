name: Publish to CurseForge
# create-release.yml calls this workflow and hands it the tag it just cut. Keep that the only
# automatic path: a release event reaches a workflow or not depending on which identity created
# the release, and a second trigger alongside the call publishes the same tag twice.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag to publish. Empty resolves the latest release.'
        type: string
        default: ''
      changelog:
        description: 'Markdown notes for the uploaded files. Empty falls back to the release body.'
        type: string
        default: ''
      voices:
        description: 'Quoted comma-separated voices. Empty selects every published voice.'
        type: string
        default: ''
      addons:
        description: 'Quoted comma-separated addons. Empty selects every published addon.'
        type: string
        default: ''
      force_publish:
        description: 'Upload even when the packaged addon matches the previous release.'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish e.g. "v12.1.0-r3". Empty resolves the latest release.'
        default: ''
        required: false
      voices:
        description: 'Quoted comma-separated voices. Empty selects every published voice.'
        default: ''
        required: false
      addons:
        description: 'Quoted comma-separated addons. Empty selects every published addon.'
        default: ''
        required: false
      force_publish:
        description: 'Upload the selected packages even when their contents are unchanged'
        type: boolean
        default: true
        required: true

# Serialize automatic and manual runs so they don't race on the same CurseForge project.
concurrency:
  group: publish-to-curseforge
  cancel-in-progress: false

jobs:
  plan-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      game_versions: ${{ steps.game-versions.outputs.game_versions }}
      packages: ${{ steps.plan.outputs.packages }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          release_tag="$RELEASE_TAG_INPUT"
          if [ -z "$release_tag" ]; then
            release_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          if [ -z "$release_tag" ] || [ "$release_tag" = "null" ]; then
            echo "Could not determine the release tag to publish" >&2
            exit 1
          fi
          echo "Publishing ${release_tag}"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
      - name: Check out release policy
        # Keep the current planner available when manually republishing an older tag. Its game
        # versions still come from that tag's appsettings below. No tracked audio is needed.
        uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/output/
          sparse-checkout-cone-mode: false
      - name: Resolve game versions
        id: game-versions
        # Very old tags without appsettings used their base tag as the game version.
        run: |
          if git show "${RELEASE_TAG}:appsettings.json" > release-appsettings.json 2>/dev/null; then
            game_versions=$(python scripts/game_versions.py --settings release-appsettings.json)
          else
            game_versions="${RELEASE_TAG#v}"
            game_versions="${game_versions%%-*}"
          fi
          echo "Publishing for game versions: ${game_versions}"
          echo "game_versions=${game_versions}" >> "$GITHUB_OUTPUT"
      - name: Resolve changelog
        id: changelog
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changelog="$CHANGELOG_INPUT"
          if [ -z "$changelog" ]; then
            changelog=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          fi
          delimiter="CHANGELOG_${RANDOM}${RANDOM}"
          {
            echo "changelog<<${delimiter}"
            echo "$changelog"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
      - name: Download assets and plan uploads
        id: plan
        env:
          ADDONS_INPUT: ${{ inputs.addons }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOICES_INPUT: ${{ inputs.voices }}
        run: |
          selection_args=()
          if [ -n "$VOICES_INPUT" ]; then
            selection_args+=(--voices "[$VOICES_INPUT]")
          fi
          if [ -n "$ADDONS_INPUT" ]; then
            selection_args+=(--addons "[$ADDONS_INPUT]")
          fi

          mkdir -p current previous
          mapfile -t current_archives < <(
            python scripts/plan_curseforge_release.py --current-tag "$RELEASE_TAG" \
              --list-assets "${selection_args[@]}"
          )
          for archive in "${current_archives[@]}"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$archive" --dir current
          done

          plan_args=(--current-tag "$RELEASE_TAG" --current-dir current "${selection_args[@]}")
          if [ "$FORCE_PUBLISH" = "true" ]; then
            plan_args+=(--force)
          else
            previous_tag=$(git describe --tags --abbrev=0 --match 'v*' "${RELEASE_TAG}^" 2>/dev/null || true)
            if [ -n "$previous_tag" ]; then
              assets=$(gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name' 2>/dev/null || true)
              mapfile -t previous_archives < <(
                python scripts/plan_curseforge_release.py --current-tag "$previous_tag" \
                  --list-assets "${selection_args[@]}"
              )
              for previous_archive in "${previous_archives[@]}"; do
                if grep -Fxq "$previous_archive" <<< "$assets"; then
                  gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
                    --pattern "$previous_archive" --dir previous
                fi
              done
              plan_args+=(--previous-tag "$previous_tag" --previous-dir previous)
            fi
          fi

          packages=$(python scripts/plan_curseforge_release.py "${plan_args[@]}")
          count=$(jq length <<< "$packages")
          echo "Planned ${count} CurseForge upload(s)"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            matrix='{"include":[{"publish":false,"voice":"unchanged","addon":"unchanged","project_id":0,"relations":"","archive":""}]}'
            echo "No package contents changed; CurseForge uploads are skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            matrix=$(jq -cn --argjson packages "$packages" \
              '{include: [$packages[] + {publish: true}]}')
            {
              echo "### CurseForge uploads"
              echo
              jq -r '.[] | "- \(.addon) (\(.voice))"' <<< "$packages"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  publish-addon:
    needs: plan-release
    strategy:
      # Each upload is independent; don't cancel the rest when one project fails.
      max-parallel: 3
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-release.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Publish ${{ matrix.addon }} (${{ matrix.voice }}) (Project ID ${{ matrix.project_id }})
    steps:
      - name: Download release asset
        if: matrix.publish == true
        env:
          ARCHIVE: ${{ matrix.archive }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan-release.outputs.release_tag }}
        run: |
          mkdir -p current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --dir current
          if [ ! -s "current/$ARCHIVE" ]; then
            echo "Downloaded release asset is missing or empty: $ARCHIVE" >&2
            exit 1
          fi
      - name: Upload to CurseForge
        if: matrix.publish == true
        uses: itsmeow/curseforge-upload@v3
        with:
          file_path: current/${{ matrix.archive }}
          game_endpoint: 'wow'
          project_id: ${{ matrix.project_id }}
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          display_name: ${{ matrix.addon }} (${{ matrix.voice }}) ${{ needs.plan-release.outputs.release_tag }}
          game_versions: ${{ needs.plan-release.outputs.game_versions }}
          relations: ${{ matrix.relations }}
          changelog: ${{ needs.plan-release.outputs.changelog }}
          changelog_type: markdown
