name: Create release
on:
  pull_request:
    types: [ closed ]
    branches: [ main ]
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

concurrency:
  group: create-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: github.event.pull_request.merged == true || github.event_name  != 'pull_request'
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      release_tag: ${{ steps.set-release-tag.outputs.release_tag || steps.set-release-tag-push.outputs.release_tag }}
      released: ${{ steps.existing-release.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Set release tag
        id: set-release-tag
        if: github.event_name != 'push'
        run: |
          # update.yml resets release-revision.txt to 0 whenever BigWigs moves, which is
          # exactly when the bare version tag is most likely to exist already. Handing
          # action-gh-release a tag that exists makes it update that release in place, so
          # the build is never delivered. Walk the revision forward to the first free tag.
          #
          # The -r{n} suffix shape matters: publish-to-curseforge.yml derives the game
          # version as ${RELEASE_TAG#v} then %%-*, so anything after the first dash is
          # discarded there.
          #
          # checkout runs with fetch-depth: 0 above, so every tag is local and no network
          # call is needed to test one.
          base=$(cat bigwigs-voice-version.txt)
          revision=$(cat release-revision.txt 2>/dev/null || echo 0)

          candidate_for() {
            if [ "$1" -gt 0 ]; then echo "${base}-r$1"; else echo "${base}"; fi
          }

          candidate=$(candidate_for "$revision")
          attempts=0
          while git rev-parse -q --verify "refs/tags/${candidate}" >/dev/null; do
            echo "Tag ${candidate} already exists"
            attempts=$(( attempts + 1 ))
            if [ "$attempts" -gt 100 ]; then
              echo "No free release tag after 100 attempts (last tried: ${candidate})" >&2
              exit 1
            fi
            revision=$(( revision + 1 ))
            candidate=$(candidate_for "$revision")
          done

          echo "Release tag: ${candidate}"
          echo "RELEASE_TAG=${candidate}" >> "$GITHUB_ENV"
          echo "release_tag=${candidate}" >> "$GITHUB_OUTPUT"
      - name: Set release tag from push event
        id: set-release-tag-push
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"
          echo "release_tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      - name: Skip a tag that has already been released
        id: existing-release
        # Creating a release creates its tag, and a tag created by the PAT can push this
        # workflow again. That second run would repackage, update the release in place and
        # publish every archive to CurseForge a second time. The dispatch path walks to a free
        # tag, so a release that already exists means this run has nothing to do.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An error is not an answer: anything but a definite yes or no stops the run, because
          # guessing "no" here re-releases the tag and uploads every archive to CurseForge again.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          case "${code}" in
            200)
              echo "${RELEASE_TAG} has already been released"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not tell whether ${RELEASE_TAG} is already released (HTTP ${code})" >&2
              exit 1
              ;;
          esac
      - name: Package artifacts
        if: steps.existing-release.outputs.skip != 'true'
        run: ./scripts/package.sh
      - name: Create GitHub Release
        id: create-release
        if: steps.existing-release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            Automatically created by the release workflow.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
          preserve_order: true
          files: |
            ./dist/*.zip
            ./bigwigs-voice-version.txt
            ./release-revision.txt
          # The action reads its token input, not env.GITHUB_TOKEN, and that input defaults to
          # the workflow's own GITHUB_TOKEN. Passing the PAT here is what keeps the release
          # from being authored by github-actions[bot].
          token: ${{ secrets.WORKFLOW_RELEASE_PAT }}

  # Called, not triggered: whether a release event reaches another workflow depends on which
  # identity created the release, and that has silently swallowed the CurseForge upload twice
  # (v12.1.0-r1 and -r2 both shipped to GitHub and never reached CurseForge). Naming the
  # dependency makes the release-to-CurseForge path the same one every time.
  publish-to-curseforge:
    needs: create-release
    if: needs.create-release.outputs.released == 'true'
    # A called workflow can only be granted less than the job that calls it, and this repository
    # defaults its token to read. Without this the publisher runs with whatever the default is,
    # which is how a permission it needs turns into a failed release rather than a failed upload.
    permissions:
      contents: read
    uses: ./.github/workflows/publish-to-curseforge.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.create-release.outputs.release_tag }}
